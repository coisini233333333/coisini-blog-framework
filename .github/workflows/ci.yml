name: Framework CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/example-blog']
    env:
      SITE_CONTENT_DIR: examples/site
      SITE_URL: https://example.com
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:build
      - run: npm run test:privacy
# Deliberately no deployment: testing examples must not overwrite a personal site.
